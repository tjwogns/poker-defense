- 실행한 정확한 명령과 결과
- 수용 기준별 통과·실패 여부
- 실패 재현 단계, 예상 동작과 실제 동작
- 심각도와 사용자 영향
- 확인하지 못한 영역과 이유

문제가 없을 때도 검증한 범위와 남아 있는 위험을 명시한다.
