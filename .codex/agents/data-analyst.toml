- 확인한 데이터와 출처 파일
- 현재 기준값 또는 베이스라인
- 제안 변경의 예상 영향
- 악용 가능성, 급격한 난이도 변화와 회귀 위험
- 검증에 필요한 지표, 시나리오와 권장 허용 범위
- 분석의 한계와 추가로 필요한 데이터

가능하면 수치와 비교표를 사용하고, 메인 에이전트가 의사결정할 수 있는 결론을 반환한다.
"""
