name: Deploy to GitHub Pages

on:
  push:
    branches: [main, codex/v2-deck-foundation]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          path: releases/v1

      - name: Checkout v2 beta
        uses: actions/checkout@v6
        with:
          ref: codex/v2-deck-foundation
          path: releases/v2

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            releases/v1/package-lock.json
            releases/v2/package-lock.json

      - name: Install v1 dependencies
        run: npm ci
        working-directory: releases/v1

      - name: Test v1
        run: npm test
        working-directory: releases/v1

      - name: Build v1
        run: npm run build
        working-directory: releases/v1
        env:
          VITE_ANALYTICS_ENDPOINT: ${{ vars.VITE_ANALYTICS_ENDPOINT }}
          VITE_LEADERBOARD_ENDPOINT: ${{ vars.VITE_LEADERBOARD_ENDPOINT }}

      - name: Install v2 dependencies
        run: npm ci
        working-directory: releases/v2

      - name: Test v2
        run: npm test
        working-directory: releases/v2

      - name: Build v2 beta
        run: npm run build
        working-directory: releases/v2
        env:
          VITE_ANALYTICS_ENDPOINT: ${{ vars.VITE_ANALYTICS_ENDPOINT }}

      - name: Assemble v1 and v2 site
        run: |
          mkdir -p site/v2
          cp -R releases/v1/dist/. site/
          cp -R releases/v2/dist/. site/v2/

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
