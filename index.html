<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0f" />
    <meta name="description" content="포커 족보로 군단을 만들고 60라운드를 지키는 전략 웹게임, 포커 디펜스." />
    <title>포커 디펜스</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>" />
    <style>
      html, body { margin: 0; padding: 0; background: #08080c; width: 100%; height: 100%; min-height: 100dvh; overflow: hidden; overscroll-behavior: none; }
      #app { display: flex; justify-content: center; align-items: center; width: 100vw; height: 100vh; height: 100dvh; }
      canvas { max-width: 100%; max-height: 100%; box-shadow: 0 20px 80px rgba(0,0,0,.55); touch-action: none; user-select: none; -webkit-user-select: none; }
      canvas:focus-visible { outline: 3px solid #e6c84f; outline-offset: -3px; }
      .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
      #boot-splash { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; color: #f2ede3; background: radial-gradient(circle at 68% 22%, #1a1424 0, #0d0c14 42%, #08080c 78%); font-family: Pretendard, system-ui, sans-serif; opacity: 1; transition: opacity .28s ease; }
      #boot-splash.ready { opacity: 0; pointer-events: none; }
      .boot-card { width: min(340px, calc(100vw - 56px)); text-align: center; }
      .boot-mark { color: #e8b54b; font: 800 44px/1 Georgia, "Times New Roman", serif; letter-spacing: 10px; text-shadow: 0 5px 24px rgba(232,181,75,.2); }
      .boot-title { margin-top: 20px; color: #e8b54b; font: 800 24px/1 Georgia, "Times New Roman", serif; letter-spacing: 4px; }
      .boot-message { margin-top: 10px; color: #b5c2b8; font-size: 14px; font-weight: 650; }
      .boot-track { height: 4px; margin-top: 24px; overflow: hidden; border-radius: 99px; background: rgba(255,255,255,.1); }
      .boot-track::after { content: ''; display: block; width: 42%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #d79f36, #f0c766); animation: boot-progress 1.15s ease-in-out infinite; }
      .boot-tip { margin-top: 15px; color: #718478; font-size: 11px; }
      @keyframes boot-progress { from { transform: translateX(-110%); } to { transform: translateX(340%); } }
      #mobile-gate { display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; padding: 32px; text-align: center; color: #e6ebe5; background: #07130c; font: 700 18px/1.6 system-ui, sans-serif; box-sizing: border-box; }
      .screen-guide { max-width: 440px; }
      .screen-guide strong { display: block; margin-bottom: 10px; color: #e6c84f; font-size: 22px; }
      .screen-guide span { display: block; color: #94a698; font-size: 15px; font-weight: 500; }
      #fullscreen { min-width: 180px; min-height: 48px; margin-top: 22px; border: 1px solid rgba(255,255,255,.22); border-radius: 4px; background: #5cb187; color: #09130d; font: 700 16px system-ui, sans-serif; }
      @media (max-width: 359px), (orientation: landscape) and (max-width: 599px), (orientation: landscape) and (max-height: 279px) { #mobile-gate { display: flex; } }
      @media (prefers-reduced-motion: reduce) { canvas { box-shadow: none; } .boot-track::after { animation-duration: 2.4s; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <p id="game-instructions" class="sr-only">포커 족보로 군단을 만드는 전략 게임입니다. E로 카드를 교환하고, Enter로 족보를 확정하고, Space로 전투를 시작하거나 일시정지합니다. D는 덱, H는 도감, M은 음소거입니다.</p>
    <div id="boot-splash" role="status" aria-live="polite">
      <div class="boot-card">
        <div class="boot-mark">♠ ♦</div>
        <div class="boot-title">ROYAL SIEGE</div>
        <div class="boot-message">왕국과 카드 군단을 불러오는 중…</div>
        <div class="boot-track" aria-hidden="true"></div>
        <div class="boot-tip">첫 실행 후에는 브라우저 캐시로 더 빠르게 열립니다.</div>
      </div>
    </div>
    <div id="mobile-gate"><div class="screen-guide"><strong>가로 화면이 너무 작습니다</strong><span>브라우저 메뉴를 접거나 전체 화면으로 전환하면 실행할 수 있습니다.</span><button id="fullscreen" type="button">전체 화면 시도</button></div></div>
    <script>
      document.getElementById('fullscreen')?.addEventListener('click', () => {
        document.documentElement.requestFullscreen?.().catch(() => undefined);
      });
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
