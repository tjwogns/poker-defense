<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1a12" />
    <meta name="description" content="포커 족보로 군단을 만들고 60라운드를 지키는 전략 웹게임, 포커 디펜스." />
    <title>포커 디펜스</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🃏</text></svg>" />
    <style>
      html, body { margin: 0; padding: 0; background: #07130c; height: 100%; overflow: hidden; }
      #app { display: flex; justify-content: center; align-items: center; height: 100%; }
      canvas { box-shadow: 0 20px 80px rgba(0,0,0,.55); }
      #rotate { display: none; position: fixed; inset: 0; z-index: 100; align-items: center; justify-content: center; padding: 32px; text-align: center; color: #e6ebe5; background: #07130c; font: 700 18px/1.6 system-ui, sans-serif; }
      @media (orientation: portrait) and (max-width: 820px) { #rotate { display: flex; } }
      @media (prefers-reduced-motion: reduce) { canvas { box-shadow: none; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="rotate">📱 화면을 가로로 돌리면<br />전장을 더 선명하게 볼 수 있습니다.</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
